<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4c6fff">
<title>Кодик — тесты по технологиям программирования</title>
<script>try{var t=localStorage.getItem('kodik-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#4c6fff;--blue-d:#3753d6;--green:#2fc67a;--green-d:#1fa561;--red:#ff5b6e;--red-d:#d93a4e;--orange:#ff9f43;--purple:#8e6cff;--yellow:#ffd23f;
--ink:#25264a;--muted:#7b7ea3;--bg:#f2f5ff;--card:#fff;--hdr:rgba(255,255,255,.97);--line:#e3e8fb;--soft:#eef1fb;--soft2:#f7f9ff;--sel:#eef1ff;--okbg:#e5f9ee;--nobg:#ffe9ec;--ambbg:#fff1de;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
[data-theme=dark]{--ink:#eceeff;--muted:#a0a5d6;--bg:#0e0f23;--card:#1a1c3b;--hdr:rgba(26,28,59,.97);--line:#2c3063;--soft:#23265a;--soft2:#20224d;--sel:#26306b;--okbg:#10382c;--nobg:#40202e;--ambbg:#3d2e12;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;padding-bottom:84px;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input,select,textarea{font-family:inherit;color:inherit}
svg{display:block}
.blobs i{position:fixed;border-radius:50%;filter:blur(70px);z-index:-1;opacity:.32;animation:drift 18s ease-in-out infinite alternate}
[data-theme=dark] .blobs i{opacity:.16}
.blobs i:nth-child(1){width:340px;height:340px;background:var(--purple);top:-90px;left:-90px}
.blobs i:nth-child(2){width:300px;height:300px;background:var(--blue);bottom:-70px;right:-70px;animation-delay:-6s}
.blobs i:nth-child(3){width:220px;height:220px;background:var(--yellow);top:42%;right:18%;animation-delay:-12s;opacity:.2}
@keyframes drift{to{transform:translate(60px,40px) scale(1.15)}}
.top{position:sticky;top:0;z-index:20;background:var(--hdr);border-bottom:2px solid var(--line);transition:background .3s}
.top-in{max-width:1040px;margin:0 auto;padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:23px;letter-spacing:-.02em}
.logo .mascot{width:36px;height:36px}
.spacer{flex:1}
.chip{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:7px 12px;border-radius:14px;font-weight:800;font-size:14px;border:2px solid var(--line);background:var(--card)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:0 3px 0 #6f4de0}
.icon-btn{width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:.2s;flex:none}
.icon-btn:hover{color:var(--blue);border-color:#b9c4f5}
.icon-btn.del:hover{color:var(--red);border-color:#ffc9d0}
.icon-btn svg{width:20px;height:20px;transition:transform .5s}
.icon-btn[data-act=theme]:hover svg{transform:rotate(90deg)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:2px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:11px;color:var(--muted);padding:6px;border-radius:14px;cursor:pointer;transition:.15s}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--blue);background:var(--sel)}
.testing .nav{display:none}
@media(min-width:760px){body{padding-bottom:0}.nav{position:static;border:0;background:none;padding:0;gap:6px;margin-left:18px}.nav button{flex:none;flex-direction:row;font-size:15px;padding:9px 14px}}
main{max-width:1040px;margin:0 auto;padding:22px 18px 40px}
.testing main{padding-bottom:200px}
.enter{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.stagger>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
h2.sec{font-size:22px;font-weight:900;margin:26px 0 14px}
.card{background:var(--card);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);border-radius:24px;padding:20px;transition:background .3s}
.btn{border:0;border-radius:16px;padding:14px 24px;font-weight:900;font-size:16px;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-d);cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blue-d)}
.btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d)}.btn.green:active{box-shadow:0 1px 0 var(--green-d)}
.btn.red{background:var(--red);box-shadow:0 5px 0 var(--red-d)}.btn.red:active{box-shadow:0 1px 0 var(--red-d)}
.btn.ghost{background:var(--card);color:var(--blue);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn:disabled{background:var(--soft);color:var(--muted);box-shadow:0 5px 0 var(--line);cursor:default;filter:none;opacity:.8}
.btn.wide{width:100%}
.btn.sm{padding:9px 16px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--blue-d)}.btn.sm.ghost{box-shadow:0 3px 0 var(--line)}
.btn svg{width:18px;height:18px}
/* mascot */
.mascot{width:100%;height:auto;overflow:visible}
.mascot .m-float{animation:float 3s ease-in-out infinite}
.mascot .m-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.mascot .m-ant{animation:ant 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.mascot .m-mouth{display:none}
.mascot[data-mood=happy] .happy,.mascot[data-mood=neutral] .neutral,.mascot[data-mood=sad] .sad{display:block}
.mascot[data-mood=sad] .m-body{fill:#7d92f5}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes ant{50%{transform:scale(1.25)}}
/* auth */
.auth{display:grid;gap:26px;align-items:center;max-width:920px;margin:10px auto}
@media(min-width:800px){.auth{grid-template-columns:1fr 1fr}}
.auth-l{text-align:center}
.auth-l .mascot{width:min(44vw,190px);margin:0 auto 10px}
.auth-l h1{font-size:clamp(26px,5vw,38px);font-weight:900;line-height:1.1;margin-bottom:10px}
.auth-l p{color:var(--muted);font-weight:700;line-height:1.45;max-width:380px;margin:0 auto 16px}
.auth-l .ide{max-width:380px;margin:0 auto;text-align:left}
.seg{display:flex;background:var(--soft);border-radius:16px;padding:4px;margin-bottom:18px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;color:var(--muted);transition:.2s}
.seg button.on{background:var(--card);color:var(--blue);box-shadow:0 2px 0 var(--line)}
.f{display:block;margin-bottom:14px}
.f>span{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:6px}
.in{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:14px;font-size:16px;font-weight:600;background:var(--card);transition:.15s}
.in.mono,textarea.mono{font-family:var(--mono);font-size:14px;font-weight:500}
.in:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(76,111,255,.18)}
textarea.in{resize:vertical;min-height:70px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.role{position:relative}
.role input{position:absolute;opacity:0;inset:0;cursor:pointer}
.role div{border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center;font-weight:800;transition:.15s;box-shadow:0 3px 0 var(--line)}
.role input:checked+div{border-color:var(--blue);background:var(--sel);color:var(--blue);box-shadow:0 3px 0 #b9c4f5}
.role input:focus-visible+div{outline:3px solid rgba(76,111,255,.4)}
.formerr{background:var(--nobg);color:var(--red-d);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;margin-bottom:14px}
[data-theme=dark] .formerr{color:#ff8e9c}
.warn{background:var(--ambbg);color:#a86a00;border-radius:12px;padding:10px 12px;font-weight:700;font-size:13px;margin-bottom:14px}
.hid{display:none!important}
.hint{font-size:12px;font-weight:700;color:var(--muted);margin-top:5px;line-height:1.4}
/* hero & stats */
.hero{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,#4c6fff,#8e6cff);border-radius:28px;padding:20px 22px;color:#fff;box-shadow:0 6px 0 #3a52cc;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero .mascot{width:92px;flex:none}
.hero-t{flex:1;min-width:0;position:relative;z-index:1}
.bubble{background:var(--card);color:var(--ink);padding:12px 16px;border-radius:18px;font-weight:800;line-height:1.3;position:relative;display:inline-block;transition:background .3s}
.bubble::before{content:'';position:absolute;left:-8px;top:22px;border:8px solid transparent;border-right-color:var(--card);border-left:0}
.hero .bubble{background:#fff;color:#25264a}.hero .bubble::before{border-right-color:#fff}
.lvl{margin-top:14px}
.lvl-r{display:flex;justify-content:space-between;font-weight:800;font-size:13px;margin-bottom:6px}
.track{height:12px;background:var(--soft);border-radius:20px;overflow:hidden}
.track.dark{background:rgba(255,255,255,.28)}
.fill{height:100%;border-radius:20px;background:var(--c,var(--green));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0 4px}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px}
.stat .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;background:var(--c);box-shadow:0 4px 0 var(--d);color:#fff}
.stat .ic svg{width:24px;height:24px}
.stat b{display:block;font-size:24px;font-weight:900;line-height:1}
.stat span{font-size:12px;color:var(--muted);font-weight:800}
/* topics */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}
.tcard{background:var(--card);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);border-radius:24px;padding:16px;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;display:flex;flex-direction:column;gap:12px}
.tcard:hover{transform:translateY(-4px);box-shadow:0 9px 0 var(--line)}
.tcard:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.tcard:focus-visible{outline:3px solid rgba(76,111,255,.45)}
.tile{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--c);box-shadow:0 4px 0 var(--d);transition:transform .25s}
.tcard:hover .tile{transform:rotate(-8deg) scale(1.08)}
.tile svg{width:30px;height:30px;color:#fff}
.tcard h3{font-size:18px;font-weight:900;line-height:1.2}
.tcard .meta{font-size:13px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.stars{display:flex;gap:2px}
.star{width:20px;height:20px;fill:var(--line);stroke:var(--line);stroke-width:1.5;stroke-linejoin:round}
.star.on{fill:#ffc531;stroke:#e59f00}
.empty{border:2px dashed var(--line);border-radius:22px;padding:30px;text-align:center;color:var(--muted);font-weight:700}
/* test */
.t-top{display:flex;align-items:center;gap:14px;margin-bottom:20px;max-width:860px;margin-inline:auto}
.x{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--muted);box-shadow:0 3px 0 var(--line)}
.x svg{width:20px;height:20px}
.t-track{flex:1;height:16px;border-radius:20px;background:var(--soft);overflow:hidden}
.t-fill{height:100%;background:var(--green);border-radius:20px;transition:width .6s cubic-bezier(.2,.8,.2,1);position:relative}
.t-fill::after{content:'';position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.4)}
.combo{display:flex;align-items:center;gap:4px;font-weight:900;color:#e07f1f;background:var(--ambbg);border-radius:14px;padding:6px 12px;animation:pop .4s}
.combo svg{width:18px;height:18px;fill:#ff9f43;stroke:#e07f1f}
.q-wrap{display:grid;gap:16px;max-width:860px;margin:0 auto}
@media(min-width:760px){.q-wrap{grid-template-columns:150px 1fr;align-items:start}}
.q-mascot{display:flex;align-items:center;gap:12px}
.q-mascot .mascot{width:84px;flex:none}
.q-mascot .bubble{font-size:14px;padding:10px 12px}
.q-mascot .bubble::before{left:-8px;top:50%;margin-top:-8px}
@media(min-width:760px){.q-mascot{flex-direction:column-reverse;text-align:center;position:sticky;top:84px}.q-mascot .mascot{width:120px;margin:0 auto}.q-mascot .bubble::before{left:50%;top:auto;bottom:-8px;margin:0 0 0 -8px;border:8px solid transparent;border-top-color:var(--card);border-bottom:0}}
.q-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--sel);color:var(--blue);border-radius:10px;padding:3px 10px;font-size:12px;font-weight:900}
.tag svg{width:14px;height:14px}
.q-text{font-size:21px;font-weight:900;line-height:1.35;margin-bottom:6px;white-space:pre-wrap}
.q-hint{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:16px}
.ans{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:16px;background:var(--card);font-weight:700;font-size:16px;margin-bottom:12px;cursor:pointer;transition:transform .08s,box-shadow .08s,border-color .15s,background .15s,opacity .2s}
.ans:hover{border-color:#b9c4f5}
.ans:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.ans .k{width:32px;height:32px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:14px;color:var(--muted);flex:none;transition:.15s}
.ans.mu .k{border-radius:9px}.ans.mu .k svg{width:18px;height:18px;opacity:0;transition:.15s;stroke-width:3.2}
.ans.sel{border-color:var(--blue);background:var(--sel);box-shadow:0 4px 0 #b9c4f5}
.ans.sel .k{background:var(--blue);border-color:var(--blue);color:#fff}
.ans.ok{border-color:var(--green);background:var(--okbg);box-shadow:0 4px 0 #2a8f5f;animation:pop .4s}
.ans.ok .k{background:var(--green);border-color:var(--green);color:#fff}
.ans.no{border-color:var(--red);background:var(--nobg);box-shadow:0 4px 0 #b4404f;animation:shake .4s}
.ans.no .k{background:var(--red);border-color:var(--red);color:#fff}
.ans.mu.sel .k svg,.ans.mu.ok .k svg,.ans.mu.no .k svg{opacity:1}
.ans.dim{opacity:.5;pointer-events:none}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
/* order */
.ord-ans{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px;border:2px dashed var(--line);border-radius:16px;margin-bottom:14px;min-height:64px}
.ord-ans .arr{color:var(--muted);font-weight:900}
.slot{width:42px;height:42px;border-radius:12px;border:2px dashed var(--line);background:none;color:var(--muted);font-weight:900;font-size:16px;cursor:default;font-family:inherit}
.slot.on{border:2px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 3px 0 var(--blue-d);animation:pop .3s}
.ord-ans.ok{border-color:var(--green);background:var(--okbg)}.ord-ans.ok .slot.on{background:var(--green);border-color:var(--green);box-shadow:0 3px 0 var(--green-d)}
.ord-ans.no{border-color:var(--red);background:var(--nobg);animation:shake .4s}.ord-ans.no .slot.on{background:var(--red);border-color:var(--red);box-shadow:0 3px 0 var(--red-d)}
.chip2{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:16px;background:var(--card);font-weight:700;font-size:15px;margin-bottom:10px;cursor:pointer;transition:.15s;font-family:inherit}
.chip2 .k{width:32px;height:32px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
.chip2 span:nth-child(2){flex:1;min-width:0;word-break:break-word}
.chip2.code span:nth-child(2){font-family:var(--mono);font-size:13px}
.chip2 em{font-style:normal;background:var(--blue);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:12px;font-weight:900;animation:pop .3s}
.chip2:hover{border-color:#b9c4f5}
.chip2.used{opacity:.45;background:var(--soft)}
.chip2:disabled{cursor:default}
/* text answer */
.txt{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:16px;padding:4px 14px;background:var(--card);transition:.2s}
.txt:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(76,111,255,.18)}
.txt>span{font-family:var(--mono);color:var(--blue);font-weight:700;font-size:20px}
.txt input{flex:1;border:0;outline:0;background:none;font:500 16px var(--mono);padding:12px 0;min-width:0}
.txt.ok{border-color:var(--green);background:var(--okbg)}.txt.no{border-color:var(--red);background:var(--nobg);animation:shake .4s}
/* ide */
.ide{border-radius:16px;overflow:hidden;background:#15172f;border:2px solid #2a2e5c;box-shadow:0 5px 0 #0c0d1e;margin:4px 0 14px;text-align:left}
.ide-bar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#1e2145;font-family:var(--mono);font-size:12px;color:#8e95d6}
.ide-bar .dots{display:flex;gap:6px}.ide-bar .dots i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.ide-bar .dots i:nth-child(2){background:#febc2e}.ide-bar .dots i:nth-child(3){background:#28c840}
.ide-bar .fn{flex:1}.ide-bar em{font-style:normal;background:#2a2e5c;border-radius:8px;padding:2px 8px;font-size:11px}
.ide-body{display:flex;font:400 14px/1.65 var(--mono);color:#e6e8ff}
.gut{padding:12px 10px 12px 14px;color:#4f5694;text-align:right;user-select:none;margin:0;font:inherit;background:#181a38;min-width:42px}
.ide-code{flex:1;overflow-x:auto;min-width:0}
.ide-in{position:relative;min-width:100%;width:max-content}
.hl{margin:0;padding:12px 16px;font:inherit;white-space:pre;min-height:calc(1.65em*3 + 24px);tab-size:2}
.ide-in textarea{position:absolute;inset:0;width:100%;height:100%;border:0;outline:0;resize:none;background:transparent;color:transparent;caret-color:#fff;padding:12px 16px;font:inherit;white-space:pre;overflow:hidden;tab-size:2}
.ide-in textarea::placeholder{color:#4f5694}
.ide:focus-within{border-color:var(--blue);box-shadow:0 5px 0 #0c0d1e,0 0 0 4px rgba(76,111,255,.2)}
.ide.done{opacity:.92}
.tk-c{color:#6f77b3;font-style:italic}.tk-s{color:#7be0a3}.tk-k{color:#ff7eb6}.tk-n{color:#ffb86b}.tk-t{color:#7ab7ff}
.ide.snip{box-shadow:none;margin:6px 0 16px}
.runbar{display:flex;gap:10px;margin-bottom:12px}
.con{border-radius:16px;background:#15172f;border:2px solid #2a2e5c;overflow:hidden;font-family:var(--mono);font-size:13px}

.con-b{padding:12px 14px;color:#8e95d6}

.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:14px 18px calc(14px + env(safe-area-inset-bottom));z-index:40}
.foot-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:16px;justify-content:flex-end}
.foot.ok,.foot.no{animation:slideup .4s cubic-bezier(.2,.8,.2,1)}
.foot.ok{background:var(--okbg);border-color:#2a8f5f}.foot.no{background:var(--nobg);border-color:#b4404f}

[data-theme=dark] .foot.ok h3{color:#47e39a}[data-theme=dark] .foot.no h3{color:#ff8e9c}

.foot-in>.btn:only-child{width:100%}
@media(min-width:760px){.foot-in>.btn:only-child{width:auto;min-width:200px}}

.res .mascot{width:150px;margin:0 auto 6px}

.res p.sub{color:var(--muted);font-weight:700;margin-bottom:18px}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

<line x1="60" y1="16" x2="60" y2="30" stroke="#25264a" stroke-width="4" stroke-linecap="round"/>

/* ===== Подсветка кода ===== */
const KW = { js: 'function|const|let|var|return|if|else|for|while|do|of|in|new|class|extends|true|false|null|undefined|typeof|async|await|break|continue|switch|case|default|import|export|from|this|try|catch|throw',

  sql: 'SELECT|FROM|WHERE|INSERT|INTO|VALUES|UPDATE|SET|DELETE|JOIN|LEFT|RIGHT|INNER|ON|GROUP|BY|ORDER|HAVING|AND|OR|NOT|NULL|AS|LIMIT|COUNT|SUM|AVG|MAX|MIN|CREATE|TABLE|DISTINCT|LIKE' };
const CM = { js: '\\/\\/.*|\\/\\*[\\s\\S]*?\\*\\/', py: '#.*', sql: '--.*', html: '<!--[\\s\\S]*?-->', other: '\\/\\/.*|#.*' };
const LANG = { js: 'JavaScript', py: 'Python', sql: 'SQL', html: 'HTML/CSS', other: 'Код' };
const FILE = { js: 'solution.js', py: 'solution.py', sql: 'query.sql', html: 'index.html', other: 'solution.txt' };
const HLRE = {};
Object.keys(LANG).forEach(l => {
  const kw = l === 'html' ? '(?!)' : (KW[l] || KW.js);

function hl(code, lang) {
  const R = HLRE[lang] || HLRE.js; R.lastIndex = 0; let out = '', last = 0, m;

async function loadQuestions() { const s = await db.collection('questions').get(); S.questions = s.docs.map(d => ({ id: d.id, ...d.data() })); }

function stats() {
  const r = S.results, xp = r.reduce((a, x) => a + x.score * 10, 0);
  const avg = r.length ? Math.round(r.reduce((a, x) => a + pct(x), 0) / r.length) : 0;
  const stars = r.reduce((a, x) => a + starsOf(pct(x)), 0);
  const days = new Set(r.map(x => dayKey(x.date)));
  let streak = 0, d = new Date(); if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  while (days.has(dayKey(d))) { streak++; d.setDate(d.getDate() - 1); }
  return { xp, avg, stars, streak, lvl: Math.floor(xp / 100) + 1, into: xp % 100, count: r.length };
}
function topicList() {
  const m = new Map(); S.questions.forEach(q => m.set(q.topic, (m.get(q.topic) || 0) + 1));
  return [...m].map(([name, count]) => { const rs = S.results.filter(r => r.topic === name); return { name, count, best: rs.length ? Math.max(...rs.map(pct)) : null }; });
}

function confetti() {

}

/* ===== Проверка ответов ===== */
const cmpNorm = (s, cs) => { s = String(s).trim().replace(/\s+/g, ' '); return cs ? s : s.toLowerCase(); };
const squash = s => s.toLowerCase().replace(/\s+/g, ' ').replace(/\s*([(){}\[\];,:=<>+\-*\/"'`])\s*/g, '$1').trim().replace(/;$/, '');
function matchVariants(vs, code) {
  return vs.some(v => {
    const m = v.match(/^\/(.+)\/([a-z]*)$/s);
    if (m) { try { return new RegExp(m[1], m[2] || 'i').test(code.trim()); } catch (e) { return false; } }
    return squash(v) === squash(code);
  });
}
function parseTest(line) {
  const k = line.lastIndexOf('=>');
  if (k < 0) throw Error('В тесте нет знака «=>»: ' + line);
  const left = line.slice(0, k).trim(), right = line.slice(k + 2).trim();
  try { return { args: JSON.parse('[' + left + ']'), exp: JSON.parse(right), left, right }; }
  catch (e) { throw Error('Не удалось разобрать тест «' + line + '». Используйте формат JSON: строки в двойных кавычках.'); }
}
const WORKER_SRC = `onmessage=e=>{const d=e.data;let f;try{f=new Function(d.code+'\\n;return typeof '+d.fn+'==="function"?'+d.fn+':undefined')()}catch(err){postMessage({error:String(err)});return}
if(!f){postMessage({error:'Функция '+d.fn+' не найдена. Проверьте название.'});return}
postMessage({rows:d.tests.map(t=>{try{const o=f(...t.args);const s=o===undefined?'undefined':JSON.stringify(o);return{ok:s===JSON.stringify(t.exp),out:s}}catch(err){return{ok:false,out:'ошибка: '+err.message}}})})}`;
function runTests(it, code) {
  return new Promise(res => {
    const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' })); let w;
    try { w = new Worker(url); } catch (e) { res({ ok: false, error: 'Браузер не позволяет запустить код.', rows: [] }); return; }
    const done = r => { clearTimeout(to); w.terminate(); URL.revokeObjectURL(url); res(r); };
    const to = setTimeout(() => done({ ok: false, error: 'Превышено время выполнения: возможен бесконечный цикл.', rows: [] }), 3000);
    w.onmessage = e => { const d = e.data; if (d.error) return done({ ok: false, error: d.error, rows: [] });
      const rows = d.rows.map((r, i) => ({ ...r, label: `${it.fn}(${it.tests[i].left}) → ${it.tests[i].right}` })); done({ ok: rows.every(r => r.ok), rows }); };
    w.onerror = e => done({ ok: false, error: e.message || 'Ошибка в коде.', rows: [] });
    w.postMessage({ code, fn: it.fn, tests: it.tests.map(t => ({ args: t.args, exp: t.exp })) });
  });
}
async function evaluate(it, a) {
  switch (it.type) {
    case 'single': return { ok: it.opts[a].ok };
    case 'multi': { const s = new Set(a); return { ok: it.opts.every((o, j) => o.ok === s.has(j)) }; }
    case 'order': return { ok: a.every((p, k) => it.pool[p].i === k) };
    case 'text': return { ok: it.answers.some(x => cmpNorm(x, it.cs) === cmpNorm(a, it.cs)) };
    case 'code': if (it.mode === 'tests') { const r = await runTests(it, a); return { ok: r.ok, run: r }; } return { ok: matchVariants(it.variants, a) };
  }
}

/* ----- Тест ----- */
const PRAISE = ['Верно!', 'Отлично!', 'Так держать!', 'В точку!', 'Блестяще!'];
function makeItem(q) {
  const type = q.type || 'single', it = { type, text: q.text, snippet: q.snippet, lang: q.lang || 'js', explain: q.explain };
  if (type === 'single' || type === 'multi') { const cs = type === 'single' ? [q.correct ?? q.correctIndex] : q.correct; it.opts = shuffle(q.options.map((t, i) => ({ t, ok: cs.includes(i) }))); }
  if (type === 'order') it.pool = shuffle(q.items.map((t, i) => ({ t, i })));
  if (type === 'text') { it.answers = q.answers; it.cs = !!q.cs; }
  if (type === 'code') { it.mode = q.mode || 'patterns'; it.starter = q.starter || ''; it.fn = q.fn; it.variants = q.variants || []; if (it.mode === 'tests') it.tests = (q.tests || []).map(parseTest); }
  return it;
}
const initA = it => it.type === 'single' ? null : it.type === 'multi' || it.type === 'order' ? [] : it.type === 'code' ? it.starter : '';
const hasAnswer = (it, a) => it.type === 'single' ? a != null : it.type === 'multi' ? a.length > 0 : it.type === 'order' ? a.length === it.pool.length : a.trim() !== '';
function startTest(topic) {
  const qs = shuffle(S.questions.filter(q => q.topic === topic)).slice(0, 10), items = [];
  qs.forEach(q => { try { items.push(makeItem(q)); } catch (e) {} });
  if (!items.length) return;
  S.test = { topic, items, i: 0, a: initA(items[0]), run: null, ok: null, checked: false, busy: false, correct: 0, combo: 0, mood: 'happy', say: 'Подумай и выбери ответ!', fresh: true };
  S.tab = 'test'; render(); scrollTo(0, 0);
}
function qBody(T, it) {
  const done = T.checked, a = T.a;
  if (it.type === 'single' || it.type === 'multi') return it.opts.map((o, j) => {
    const mu = it.type === 'multi', on = mu ? a.includes(j) : a === j; let c = 'ans' + (mu ? ' mu' : '');
    if (done) c += o.ok ? ' ok' : on ? ' no' : ' dim'; else if (on) c += ' sel';
    return `<button class="${c}" data-act="pick" data-j="${j}"><span class="k">${mu ? svg('check') : LET[j]}</span><span>${esc(o.t)}</span></button>`;
  }).join('');
  if (it.type === 'order') return `<div class="ord-ans ${done ? (T.ok ? 'ok' : 'no') : ''}">${it.pool.map((_, k) => `${k ? '<span class="arr">→</span>' : ''}<button class="slot ${a[k] != null ? 'on' : ''}" data-act="unpick" data-k="${k}" ${done ? 'disabled' : ''}>${a[k] != null ? LET[a[k]] : k + 1}</button>`).join('')}</div>
    ${it.pool.map((p, j) => { const idx = a.indexOf(j); return `<button class="chip2 ${idx >= 0 ? 'used' : ''} ${/^[a-z]+ |[(){};=]/i.test(p.t) ? 'code' : ''}" data-act="opick" data-j="${j}" ${done ? 'disabled' : ''}><span class="k">${LET[j]}</span><span>${esc(p.t)}</span>${idx >= 0 ? `<em>${idx + 1}</em>` : ''}</button>`; }).join('')}`;
  if (it.type === 'text') return `<div class="txt ${done ? (T.ok ? 'ok' : 'no') : ''}"><span>&gt;</span><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Введите ответ" value="${esc(a)}" ${done ? 'disabled' : ''}></div>`;
  if (it.type === 'code') return ideHTML(a, it.lang, { edit: true, done }) + (it.mode === 'tests' ? `${done ? '' : `<div class="runbar"><button class="btn sm ghost" data-act="run">${svg('play')}Запустить тесты</button></div>`}<div id="console">${consoleHTML(T.run)}</div>` : '');
}
function consoleHTML(run) {
  if (!run) return '<div class="con"><div class="con-h"><i></i>Консоль</div><div class="con-b">Нажмите «Запустить тесты», чтобы проверить решение до отправки.</div></div>';
  const rows = run.error ? `<div class="cr bad" style="--i:0">${svg('x')}<span>${esc(run.error)}</span></div>`
    : run.rows.map((r, i) => `<div class="cr ${r.ok ? 'good' : 'bad'}" style="--i:${i}">${svg(r.ok ? 'check' : 'x')}<span>${esc(r.label)}${r.ok ? '' : ' — получено ' + esc(r.out)}</span></div>`).join('');
  const pass = run.rows.filter(r => r.ok).length;
  return `<div class="con"><div class="con-h"><i></i>Консоль</div>${rows}<div class="con-s ${run.ok ? 'ok' : 'no'}"><span>Тестов пройдено</span><b>${pass} из ${run.rows.length || '—'}</b></div></div>`;
}
function rightAnswer(it) {
  if (it.type === 'single') return it.opts.find(o => o.ok).t;
  if (it.type === 'multi') return it.opts.filter(o => o.ok).map(o => o.t).join('; ');
  if (it.type === 'order') return Array.from({ length: it.pool.length }, (_, k) => LET[it.pool.findIndex(p => p.i === k)]).join(' → ');
  if (it.type === 'text') return it.answers[0];
  if (it.type === 'code') return it.mode === 'tests' ? null : (it.variants.find(v => !/^\/.+\/[a-z]*$/s.test(v)) || null);
}
function testView() {
  const T = S.test, it = T.items[T.i], n = T.items.length, done = Math.round((T.i + (T.checked ? 1 : 0)) / n * 100);
  const body = `<div class="${T.fresh ? 'enter' : ''}">
  <div class="t-top"><button class="x" data-act="quit" aria-label="Выйти из теста">${svg('x')}</button><div class="t-track"><div class="t-fill" style="width:${done}%"></div></div>${T.combo >= 2 ? `<div class="combo" title="Верных ответов подряд">${svg('flame')}${T.combo}</div>` : ''}</div>
  <div class="q-wrap"><div class="q-mascot"><div class="bubble">${T.say}</div>${mascot(T.mood)}</div>
  <div class="card"><div class="q-meta"><span class="tag">${svg(TICO[it.type])}${TNAME[it.type]}</span><span>Вопрос ${T.i + 1} из ${n} · ${esc(S.test.topic)}</span></div>
  <div class="q-text">${esc(it.text)}</div><div class="q-hint">${THINT[it.type]}</div>
  ${it.snippet ? ideHTML(it.snippet, it.lang, { name: 'пример' }) : ''}${qBody(T, it)}</div></div></div>`;
  T.fresh = false;
  let foot;

function buildQuestion(f) {
  const v = n => f.elements[n].value.trim(), t = v('qtype'), lines = n => v(n).split('\n').map(s => s.trim()).filter(Boolean);
  const d = { topic: v('topic'), type: t, text: v('text'), snippet: v('snippet') || null, lang: v('lang'), explain: v('explain') || null, authorId: S.user.uid, createdAt: Date.now() };
  if (!d.topic || !d.text) throw Error('Заполните тему и текст вопроса.');
  if (t === 'single' || t === 'multi') {
    const rows = [...f.querySelectorAll('.optrow')].map(r => ({ t: r.querySelector('.ot').value.trim(), c: r.querySelector('.oc').checked })).filter(r => r.t);
    if (rows.length < 2) throw Error('Добавьте минимум два варианта ответа.');
    const idx = rows.map((r, i) => r.c ? i : -1).filter(i => i >= 0);

    d.options = rows.map(r => r.t); d.correct = t === 'single' ? idx[0] : idx;
  } else if (t === 'order') {
    d.items = lines('items'); if (d.items.length < 2 || d.items.length > 8) throw Error('Для порядка нужно от 2 до 8 элементов.');
  } else if (t === 'text') {

  } else {

      d.tests = lines('tests'); if (!d.tests.length) throw Error('Добавьте хотя бы один тест.'); d.tests.forEach(parseTest);
      d.starter = f.elements.starter.value.replace(/\s+$/, ''); d.lang = 'js';
    } else {

    }
  }
  return d;
}

}

/* ===== Вход, регистрация, события ===== */
function setTheme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem('kodik-theme', t); } catch (e) {} document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#1a1c3b' : '#4c6fff'; renderHeader(); }
const ACT = {
  theme: () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'),
  mode: (_, b) => { S.authMode = b.dataset.m; render(); },
  logout: () => auth.signOut(),
  topic: (_, b) => startTest(topicList()[+b.dataset.i].name),
  pick: (_, b) => pick(+b.dataset.j), opick: (_, b) => opick(+b.dataset.j), unpick: (_, b) => unpick(+b.dataset.k),
  check, next, run, seed: seedDemo,
  quit: () => { if (confirm('Выйти из теста? Прогресс не сохранится.')) { S.test = null; S.tab = 'topics'; render(); } },
  again: () => startTest(S.last.topic),
  home: () => { S.tab = 'topics'; render(); },
  addopt: (_, b) => { const f = b.closest('form'); if (f.querySelectorAll('.optrow').length < 6) addOpt(f); else toast('Не больше шести вариантов'); },
  rmopt: (_, b) => { const f = b.closest('form'); if (f.querySelectorAll('.optrow').length > 2) b.closest('.optrow').remove(); else toast('Нужно минимум два варианта'); },
  delq: async (_, b) => {
    if (!confirm('Удалить этот вопрос из банка?')) return;
    try { await db.collection('questions').doc(b.dataset.id).delete(); S.questions = S.questions.filter(q => q.id !== b.dataset.id); render(); toast('Вопрос удалён', 'good'); }
    catch (e) { toast('Не удалось удалить: ' + (e.code || e.message), 'bad'); }
  }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) { S.tab = t.dataset.tab; S.test = null; render(); scrollTo(0, 0); return; }
  const b = e.target.closest('[data-act]'); if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b.dataset, b);
});
document.addEventListener('change', e => {
  const n = e.target;
  if (n.matches('[data-change=filter]')) { S.filter = n.value; render(); }
  if (n.name === 'role') { const t = n.value === 'teacher'; $('#grp').classList.toggle('hid', t); $('#tcode').classList.toggle('hid', !t); }
  if (n.name === 'qtype') applyType(n.form, n.value);
  if (n.name === 'cmode') applyMode(n.form);
});
document.addEventListener('input', e => {
  const n = e.target, T = S.test; if (!T || S.tab !== 'test' || T.checked) return;
  if (n.id === 'ed' || n.id === 'ti') { T.a = n.value; if (n.id === 'ed') syncEd(n); const b = $('[data-act=check]'); if (b) b.disabled = !hasAnswer(T.items[T.i], T.a); }
});
document.addEventListener('keydown', e => {
  const T = S.test; if (!T || S.tab !== 'test') return;
  const n = e.target;
  if (n.id === 'ed') {
    const ins = t => { const s = n.selectionStart; n.setRangeText(t, s, n.selectionEnd, 'end'); n.dispatchEvent(new Event('input', { bubbles: true })); };
    if (e.key === 'Tab') { e.preventDefault(); ins('  '); }
    else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); check(); }
    else if (e.key === 'Enter') { e.preventDefault(); const line = n.value.slice(0, n.selectionStart).split('\n').pop(); ins('\n' + line.match(/^\s*/)[0] + (/[{(\[:]\s*$/.test(line) ? '  ' : '')); }
    return;
  }
  if (n.id === 'ti') { if (e.key === 'Enter') { e.preventDefault(); check(); } return; }
  if (/INPUT|TEXTAREA|SELECT/.test(n.tagName)) return;
  const it = T.items[T.i];
  if (e.key >= '1' && e.key <= '8' && !T.checked) { const j = +e.key - 1; if (it.opts && j < it.opts.length) pick(j); else if (it.pool && j < it.pool.length) opick(j); }
  else if (e.key === 'Enter') { e.preventDefault(); T.checked ? next() : check(); }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, k = f.dataset.form, btn = f.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  const err = m => { if ($('#ferr')) $('#ferr').innerHTML = m ? `<div class="formerr">${esc(m)}</div>` : ''; else toast(m, 'bad'); };
  try {
    if (!configured) throw { message: 'Firebase не настроен.' };
    const v = n => f.elements[n].value.trim();
    if (k === 'login') await auth.signInWithEmailAndPassword(v('email'), f.elements.password.value);
    if (k === 'register') {
      const role = f.elements.role.value; if (role === 'teacher' && !v('tcode')) throw { message: 'Введите код преподавателя.' };
      S.registering = true;
      try {
        const c = await auth.createUserWithEmailAndPassword(v('email'), f.elements.password.value);
        if (role === 'teacher') {
          try { await db.collection('teachers').doc(c.user.uid).set({ code: v('tcode'), createdAt: Date.now() }); }
          catch (x) { try { await c.user.delete(); } catch (y) { await auth.signOut(); } throw { message: 'Неверный код преподавателя. Аккаунт не создан.' }; }
        }
        await db.collection('users').doc(c.user.uid).set({ name: v('uname'), group: role === 'student' ? (v('group') || null) : null, createdAt: Date.now() });
      } finally { S.registering = false; }
      await enter(auth.currentUser);
    }
    if (k === 'question') {
      const d = buildQuestion(f), r = await db.collection('questions').add(d); S.questions.push({ id: r.id, ...d }); render(); toast('Вопрос добавлен в банк', 'good'); return;
    }
  } catch (x) { err(ERR[x.code] || x.message || 'Что-то пошло не так.'); if (btn) btn.disabled = false; }
});

async function enter(u) {
  if (!u) { S.user = null; S.test = null; S.tab = 'auth'; S.loading = false; render(); return; }
  let isT = false, prof = {};
  try { isT = (await db.collection('teachers').doc(u.uid).get()).exists; } catch (e) {}
  try { const s = await db.collection('users').doc(u.uid).get(); prof = s.exists ? s.data() : {}; } catch (e) {}
  S.user = { uid: u.uid, name: prof.name || u.email, role: isT ? 'teacher' : 'student', group: prof.group || null };
  S.tab = isT ? 'overview' : 'topics'; S.loading = true; render();
  try { await loadQuestions(); isT ? await loadAllResults() : await loadMyResults(); }
  catch (e) { toast('Не удалось загрузить данные: ' + (e.code || e.message), 'bad'); }
  S.loading = false; render();
}
if (configured) auth.onAuthStateChanged(u => { if (!S.registering) enter(u); }); else render();
</script>
